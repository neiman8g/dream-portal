<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Click-through demo of the product master, CRM and quoting system we want built. Fictional data.">
<title>CRM Build Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --ink: #1c2224;
  --muted: #5f6a66;
  --faint: #a3aca8;
  --line: #dde1dc;
  --brand: #1f6f74;
  --brand-dark: #134649;
  --brand-soft: #e6f0f0;
  --warn: #9a5b00;
  --danger: #b42318;
  --s-spec: #dcfce7; --s-progress: #cffafe; --s-late: #fef9c3; --s-none: #e4e4e7; --s-bad: #fee2e2;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { background: var(--brand-dark); color: #fff; }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 52px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #fff; }
.logo i { display: grid; grid-template-columns: repeat(3, 5px); gap: 2px; }
.logo i::before, .logo i::after { content: none; }
.logo b { display: inline-block; width: 5px; height: 5px; background: rgba(255,255,255,.85); border-radius: 1px; }
.apps { display: flex; gap: 4px; flex-wrap: wrap; }
.apps a { color: rgba(255,255,255,.8); padding: 6px 12px; border-radius: 6px; font-weight: 600; }
.apps a:hover { background: rgba(255,255,255,.1); text-decoration: none; color: #fff; }
.apps a.on { background: rgba(255,255,255,.16); color: #fff; }
.top .spacer { flex: 1; }
.top button { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.banner { background: #fff7e6; border-bottom: 1px solid #f2dfb5; color: #6b4a00; font-size: 13.5px; }
.banner .wrap { padding-block: 7px; }

main { padding-block: 22px 60px; }
.subnav { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 20px; font-size: 14px; }
.subnav span { font-weight: 700; color: var(--brand); padding: 8px 12px 8px 0; }
.subnav a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subnav a:hover { color: var(--ink); text-decoration: none; }
.subnav a.on { color: var(--ink); border-color: var(--brand); }

.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.crumbs { font-size: 13.5px; color: var(--muted); margin-bottom: 2px; }
.crumbs a { color: var(--muted); }
h1 { font-size: 24px; margin: 0; line-height: 1.2; }
h2 { font-size: 16px; margin: 0; }
.grid { display: grid; gap: 18px; }
.side { grid-template-columns: minmax(0, 1fr) 320px; }
@media (max-width: 960px) { .side { grid-template-columns: minmax(0, 1fr); } }
.cfg { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
@media (max-width: 860px) { .cfg { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card > .body { padding: 14px 16px; }
.hint { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
.empty { padding: 26px 0; text-align: center; color: var(--muted); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); padding: 7px 10px; white-space: nowrap; font-size: 13px; }
td { padding: 7px 10px; border-top: 1px solid #eef0ed; vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { filter: brightness(.97); }
tr.band td { background: #f4f6f3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.field { display: grid; gap: 4px; font-size: 13.5px; }
.field > span { font-weight: 600; color: #3f4845; }
input[type=text], input[type=email], input[type=tel], input[type=number], input:not([type]), select, textarea {
  border: 1px solid #c9cfca; border-radius: 6px; background: #fff; padding: 6px 9px; min-width: 0; width: 100%;
}
input.w-s { width: 80px; } input.w-m { width: 110px; }
textarea { resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 160px; }
.stack { display: grid; gap: 10px; }
.check { display: flex; align-items: center; gap: 7px; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dark); text-decoration: none; }
.btn.secondary { background: #fff; border-color: #c9cfca; color: var(--ink); }
.btn.secondary:hover { background: #f6f7f5; text-decoration: none; }
.btn.danger { background: #fff; border-color: #f2c4c0; color: var(--danger); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip .n { opacity: .6; margin-left: 4px; }
.badge { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; background: #eceeec; color: #3f4845; }
.co { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; font-weight: 700; background: #e1e5e2; color: #3f4845; }
.co.parent { background: var(--brand); color: #fff; }
.var { font-size: 11.5px; margin-left: 4px; color: var(--faint); }
.var.big { color: var(--warn); font-weight: 600; }
.st-draft { background: #eceeec; } .st-sent { background: var(--brand-soft); color: var(--brand-dark); }
.st-won { background: #dcfce7; color: #166534; } .st-lost, .st-dropped { background: #fef3c7; color: #92400e; }
.s-engineer_spec td { background: var(--s-spec); } .s-sales_progress td { background: var(--s-progress); }
.s-late td { background: var(--s-late); } .s-no_activity td { background: var(--s-none); } .s-non_performing td { background: var(--s-bad); }
.legend span { border-radius: 4px; padding: 1px 7px; font-size: 12px; }
.pn-big { font: 600 22px var(--mono); color: var(--brand-dark); }
dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 18px; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; text-align: right; }
dl.kv .strong { font-weight: 700; color: var(--ink); font-size: 15px; }

/* Home */
.hero { display: grid; gap: 8px; margin-bottom: 22px; }
.hero h1 { font-size: 28px; }
.hero p { margin: 0; color: var(--muted); max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.tile { display: grid; gap: 8px; align-content: start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; color: var(--ink); }
.tile:hover { border-color: var(--brand); text-decoration: none; }
.tile .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
.tile p { margin: 0; color: var(--muted); font-size: 14px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.steps li::marker { color: var(--brand); font-weight: 700; }

/* Quote document */
.sheet-wrap { overflow-x: auto; }
.sheet { min-width: 680px; max-width: 900px; margin: 0 auto; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 40px -30px rgba(0,0,0,.5); padding: 44px 48px; display: grid; gap: 26px; }
.sheet .head { display: flex; justify-content: space-between; gap: 24px; }
.sheet .brandname { font-size: 24px; font-weight: 700; color: var(--brand-dark); }
.sheet .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sheet .qno { font: 600 21px var(--mono); }
.parties { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding-block: 14px; border-block: 1px solid var(--line); }
.parties > div { display: grid; gap: 1px; align-content: start; }
.doc th { border-bottom: 1.5px solid var(--ink); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.doc tr.item td { background: #eef4f4; font-weight: 700; border-top: 0; }
.doc tr.sub td { font-weight: 600; border-top: 0; padding-bottom: 16px; }
.doc tr.opt td:nth-child(2) { padding-left: 22px; }
.doc-totals { justify-self: end; min-width: 260px; }
.terms { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; font-size: 13px; color: var(--muted); }
.terms ul { margin: 4px 0 0; padding-left: 1.1em; }
.sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; font-size: 12.5px; color: var(--muted); }
.sign div { border-top: 1px solid var(--ink); padding-top: 6px; }

.toast { position: fixed; bottom: max(18px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <a class="logo" href="#/"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i>CRM Build</a>
    <nav class="apps" id="apps">
      <a href="#/master" data-app="master">Product master</a>
      <a href="#/crm" data-app="crm">CRM</a>
      <a href="#/quotes" data-app="quotes">Quotes</a>
    </nav>
    <span class="spacer"></span>
    <button type="button" data-act="reset" title="Put all demo data back the way it started">Reset demo</button>
  </div>
</div>
<div class="banner"><div class="wrap">Training demo. All companies, people and prices are fictional. Your changes are saved only in this browser; use Reset demo to start over.</div></div>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<script src="app.js"></script>
</body>
</html>
